# Standard base input/output token prices only. Prompt cache writes, cache hits,
# batch discounts, tools, and other special pricing are excluded.
schema_version: 1
vendor: anthropic
last_updated: "2026-07-25"
source_url: "https://platform.claude.com/docs/en/about-claude/pricing"
prices:
  - model_pattern: "claude-opus-5"
    input_per_million_usd: 5.00
    output_per_million_usd: 25.00
  # Introductory price. On 2026-09-01 it becomes 3.00 / 15.00 (+50%), so preflight blocks
  # from that date until these figures are updated rather than undercounting spend.
  - model_pattern: "claude-sonnet-5"
    input_per_million_usd: 2.00
    output_per_million_usd: 10.00
    price_valid_until: "2026-08-31"
  - model_pattern: "claude-sonnet-4-5"
    input_per_million_usd: 3.00
    output_per_million_usd: 15.00
  - model_pattern: "claude-haiku-4-5"
    input_per_million_usd: 1.00
    output_per_million_usd: 5.00
  # The date-pinned identifier, which canonical-v2 requires: the methodology's own principle P2
  # forbids publishing against a rolling alias, and an unpriced model is a preflight blocker.
  # Listed explicitly rather than as `claude-haiku-4-5*`, because a wildcard would also swallow
  # any future variant at a price that may not be its own -- the mistake avoided for gpt-4o-mini.
  - model_pattern: "claude-haiku-4-5-20251001"
    input_per_million_usd: 1.00
    output_per_million_usd: 5.00
  - model_pattern: "claude-opus-4"
    input_per_million_usd: 15.00
    output_per_million_usd: 75.00
