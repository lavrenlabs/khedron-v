# Standard text input/output prices only. Cache, batch, priority, grounding,
# storage, audio/image/video special handling, and free-tier behavior are excluded.
# Gemini 2.5 Pro has a higher prompt >200k-token tier on the official page; this
# table encodes the standard <=200k-token text tier for Phase 2 cost calculation.
schema_version: 1
vendor: google
last_updated: "2026-05-04"
source_url: "https://ai.google.dev/gemini-api/docs/pricing"
prices:
  - model_pattern: "gemini-2.5-flash"
    input_per_million_usd: 0.30
    output_per_million_usd: 2.50
  - model_pattern: "gemini-2.5-flash-lite"
    input_per_million_usd: 0.10
    output_per_million_usd: 0.40
  - model_pattern: "gemini-2.5-pro"
    input_per_million_usd: 1.25
    output_per_million_usd: 10.00
