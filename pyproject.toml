[project]
name = "khedron"
version = "0.0.0"
description = "Khedron benchmark framework for evaluating AI memory systems on LoCoMo."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.5,<3.0",
    "typer>=0.12",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-ulid>=2.2",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.1",
    "tiktoken>=0.7",
    "openai>=1.30",
    "anthropic>=0.25",
    "google-genai>=1.0",
    "truststore>=0.10",
]

[project.scripts]
khedron = "khedron.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khedron"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "S"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
strict = ["src/khedron"]
